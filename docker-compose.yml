name: scientific-harness
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 30
  scientific-harness-api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      ARTIFACT_ROOT: /data/artifacts
      EXPORT_ROOT: /data/exports
      DOCKER_HOST: unix:///var/run/docker.sock
      HARNESS_CODE_VERSION: ${HARNESS_CODE_VERSION:-v0.1.0-working-tree}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./.artifacts:/data/artifacts
      - ./outputs:/data/exports
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
