[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-harness"
version = "0.2.0"
description = "Persistent execution, evidence and data infrastructure for external agents"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
 "pgvector>=0.3,<1", "mcp>=1.10,<2", "docker>=7,<8", "pyyaml>=6,<7",
 "jsonschema>=4.23,<5", "pyarrow>=18,<24", "duckdb>=1.1,<2",
 "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2",
 "openinference-semantic-conventions>=0.1,<1", "httpx>=0.27,<1"
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
[tool.hatch.build.targets.wheel]
packages = ["packages", "adapters", "domain_packs", "src/experiment_infra"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live Postgres and Docker"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
