defaults:
  - ppo_trainer
  - _self_

experiment_bridge:
  benchmark: toy
  policy_id: Qwen/Qwen3-1.7B
  session_id: ${oc.env:VERL_SESSION_ID}
  initial_checkpoint: ${oc.env:VERL_INITIAL_CHECKPOINT}
  output_dir: ${oc.env:VERL_OUTPUT_DIR}
  max_steps: 8
  max_generation_tokens: 512
  environment_timeout: 30
  allow_repair_once: false
  train_tasks: 8
  val_tasks: 5

data:
  train_files: ${oc.env:VERL_OUTPUT_DIR}/data/train.parquet
  val_files: ${oc.env:VERL_OUTPUT_DIR}/data/val.parquet
  train_batch_size: 4
  max_prompt_length: 2048
  max_response_length: 4096
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: ${oc.env:VERL_MODEL_PATH}
  actor:
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 0.000001
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.35
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      num_workers: 1
      default_agent_loop: experiment_runtime
      agent_loop_config_path: ${oc.env:VERL_AGENT_CONFIG}
    val_kwargs:
      n: 1
      do_sample: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

trainer:
  project_name: agentlab-verl
  experiment_name: ${oc.env:VERL_SESSION_ID}
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 10
  total_training_steps: 3
  save_freq: 1
  test_freq: 1
  val_before_train: true
  resume_mode: disable
  default_local_dir: ${oc.env:VERL_OUTPUT_DIR}/checkpoints
  logger: [console]
